# ==================================================
# Sports Equipment Management System - Configuration
# ==================================================

# Server Port for REST API and Web UI (http://localhost:8080)
server.port=8080

# ------------------------------------------------------------------------------
# OPTION 1: MySQL Database (Recommended for final college submission)
# If using MySQL:
# 1. Ensure MySQL service is running.
# 2. In MySQL Workbench run: CREATE DATABASE IF NOT EXISTS sports_equipment_db;
# 3. Change 'YOUR_MYSQL_PASSWORD' below to your actual MySQL root password (e.g. root, admin, or leave empty if no password).
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sports_equipment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# OPTION 2: Instant Run without MySQL (H2 In-Memory Database)
# If you don't have MySQL installed on your PC, simply comment out the 4 MySQL lines above
# and uncomment the 4 lines below to run instantly in IntelliJ with zero database setup!
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:sports_equipment_db;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

